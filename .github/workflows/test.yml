      - run: gleam format --check src test

  example:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [simple, guards, chat, live, remote, admin, openapi, gallery, notifications]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/gleam
            examples/${{ matrix.example }}/build/packages
          key: gleam-example-${{ matrix.example }}-${{ hashFiles('**/gleam.toml', '**/manifest.toml') }}
          restore-keys: gleam-example-${{ matrix.example }}-
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"
      - run: $GITHUB_WORKSPACE/scripts/ci-deps.sh
      - run: gleam test
      - if: matrix.example == 'live'
        run: gleam run -m howdy/ui diff button
      - if: matrix.example == 'live'
        run: gleam run -m tasks/css
      - run: gleam format --check src test
      # Two users in headless Chrome: a notification sent by one reaches the
      # other's open page, inbox and email.
      - if: matrix.example == 'notifications'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: matrix.example == 'notifications'
        name: Browser test (CDP)
        env:
          CHROMIUM: google-chrome
        run: |
          nohup gleam run > /tmp/notifications.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8792/ && break
            sleep 1
          done
          node browser_test/run.mjs || { cat /tmp/notifications.log; exit 1; }

  auth:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: howdy_auth_test
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U howdy_auth_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOWDY_AUTH_TEST_BACKEND: ${{ matrix.backend }}
    defaults:
      run:
        working-directory: auth
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/gleam
            auth/build/packages
            examples/auth/build/packages
          key: gleam-auth-${{ hashFiles('**/gleam.toml', '**/manifest.toml') }}
          restore-keys: gleam-auth-
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"
      - run: node --test test/pages_client_test.mjs
      - run: $GITHUB_WORKSPACE/scripts/ci-deps.sh
      - run: gleam test
      - run: gleam format --check src test
      - run: $GITHUB_WORKSPACE/scripts/ci-deps.sh
        working-directory: examples/auth
      - run: gleam test
        working-directory: examples/auth
      - run: gleam format --check src test
        working-directory: examples/auth
