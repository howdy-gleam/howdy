name: test

on:
  push:
    branches:
      - master
      - main
      - v2
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/gleam
            build/packages
          key: gleam-test-${{ hashFiles('**/gleam.toml', '**/manifest.toml') }}
          restore-keys: gleam-test-
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"
          # elixir-version: "1"
      - run: scripts/check-auth-namespace.sh
      - run: $GITHUB_WORKSPACE/scripts/ci-deps.sh
      - run: gleam test
      - run: gleam run -m rate_limit_benchmark
      - run: gleam run -m routing_benchmark
      - run: gleam format --check src test

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/gleam
            ui/build/packages
            examples/gallery/build/packages
          key: gleam-ui-${{ hashFiles('**/gleam.toml', '**/manifest.toml') }}
          restore-keys: gleam-ui-
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"
      - run: $GITHUB_WORKSPACE/scripts/ci-deps.sh
      - run: gleam test
      - run: gleam format --check src test
      # The browser behaviour in priv/behaviour.js is exercised over CDP
      # against the gallery, which serves every component.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and start the gallery
        working-directory: examples/gallery
        run: |
          $GITHUB_WORKSPACE/scripts/ci-deps.sh
          gleam build
          nohup gleam run > /tmp/gallery.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8791/ui && exit 0
            sleep 1
          done
          echo "gallery did not start"; cat /tmp/gallery.log; exit 1
      - name: Browser tests (CDP)
        env:
          CHROMIUM: google-chrome
        run: node browser_test/run.mjs
      - name: Gallery log
        if: failure()
        run: cat /tmp/gallery.log

  howdy_dev:
    runs-on: ubuntu-latest
    defaults:
