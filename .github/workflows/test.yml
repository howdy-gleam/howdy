  storage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storage
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/gleam
            storage/build/packages
          key: gleam-storage-${{ hashFiles('**/gleam.toml', '**/manifest.toml') }}
          restore-keys: gleam-storage-
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.18.1"
          rebar3-version: "3"
      # An S3-compatible server for the S3 adapter's tests. Service
      # containers cannot be given a command, so it is started here.
      - name: Start SeaweedFS
        run: |
          echo '{"identities":[{"name":"howdy","credentials":[{"accessKey":"howdytest","secretKey":"howdytestsecret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json
          docker run -d --name seaweedfs -p 9100:8333 -v /tmp/s3.json:/etc/s3.json:ro \
            chrislusf/seaweedfs:latest server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/s3.json
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9100/)" != "000" ] && exit 0
            sleep 2
          done
          docker logs seaweedfs
          exit 1
      - run: $GITHUB_WORKSPACE/scripts/ci-deps.sh
      - run: gleam test
        env:
          HOWDY_STORAGE_TEST_S3_URL: http://howdytest:howdytestsecret@127.0.0.1:9100/howdy-test
      - run: gleam format --check src test

