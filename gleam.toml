name = "howdy"
version = "1.0.0"
gleam = ">= 1.18.0"
description = "A web framework for Gleam: controllers, middleware, WebSockets, server-sent events and presence, served by ewe"
licences = ["Apache-2.0"]
repository = { type = "github", user = "mikeyjones", repo = "howdy" }
links = [{ title = "Website", href = "https://tryhowdy.dev" }]
target = "erlang"

[erlang]
application_start_module = "howdy_app"
extra_applications = ["crypto"]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
ewe = ">= 8.0.0 and < 9.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
logging = ">= 1.5.0 and < 2.0.0"
opentelemetry_api = ">= 1.5.0 and < 2.0.0"
marceau = ">= 1.3.0 and < 2.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
filepath = ">= 1.1.2 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
