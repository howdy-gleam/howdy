name = "howdy_admin_example"
version = "0.1.0"
gleam = ">= 1.18.0"
description = "A small app with a database and auth, and the howdy_admin development area mounted from dev/"
target = "erlang"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.8.0 and < 2.0.0"
gloo = ">= 1.0.2 and < 2.0.0"
howdy = { path = "../.." }
howdy_auth = { path = "../../auth" }
howdy_database = { path = "../../database" }
howdy_mail = { path = "../../mail" }
howdy_telemetry = { path = "../../telemetry" }
howdy_openapi = { path = "../../openapi" }
howdy_flags = { path = "../../flags" }
howdy_jobs = { path = "../../jobs" }
smail = ">= 2.0.1 and < 3.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
howdy_dev = { path = "../../howdy_dev" }
howdy_admin = { path = "../../admin" }
