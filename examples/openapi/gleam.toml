name = "howdy_openapi_example"
version = "0.1.0"
gleam = ">= 1.18.0"
description = "A howdy JSON API documented with howdy_openapi"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
logging = ">= 1.0.0 and < 2.0.0"
howdy = { path = "../.." }
howdy_openapi = { path = "../../openapi" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
