name = "howdy_i18n_example"
version = "0.1.0"
gleam = ">= 1.18.0"
description = "A howdy app in four languages: locale negotiation, message catalogues, formatting and translated validation"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_time = ">= 1.8.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
logging = ">= 1.0.0 and < 2.0.0"
howdy = { path = "../.." }
howdy_i18n = { path = "../../i18n" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
howdy_dev = { path = "../../howdy_dev" }
