name = "howdy_notifications_example"
version = "0.1.0"
gleam = ">= 1.18.0"
description = "Flash messages, a live notification bell, email and Web Push with howdy_notifications"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
lustre = ">= 5.7.0 and < 6.0.0"
gloo = ">= 1.0.2 and < 2.0.0"
simplifile = ">= 2.3.0 and < 3.0.0"
howdy = { path = "../.." }
howdy_database = { path = "../../database" }
howdy_jobs = { path = "../../jobs" }
howdy_mail = { path = "../../mail" }
howdy_notifications = { path = "../../notifications" }
howdy_ui = { path = "../../ui" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
