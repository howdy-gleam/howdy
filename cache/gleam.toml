name = "howdy_cache"
version = "1.0.0"
gleam = ">= 1.18.0"
description = "An application cache for Howdy apps: fetch-or-compute with expiry and tag invalidation, kept in memory or in the database"
licences = ["Apache-2.0"]
repository = { type = "github", user = "mikeyjones", repo = "howdy", path = "cache", tag-prefix = "howdy_cache-" }
target = "erlang"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
logging = ">= 1.3.0 and < 2.0.0"
gloo = ">= 1.0.2 and < 2.0.0"
howdy = { path = ".." }
howdy_database = { path = "../database" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
