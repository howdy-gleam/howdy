name = "howdy_database"
version = "2.1.0"
gleam = ">= 1.18.0"
description = "Package-owned migrations and portable transactions over Gloo for Howdy apps"
licences = ["Apache-2.0"]
repository = { type = "github", user = "mikeyjones", repo = "howdy", path = "database", tag-prefix = "howdy_database-" }
target = "erlang"

[erlang]
application_start_module = "howdy_database_app"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_crypto = ">= 1.5.0 and < 2.0.0"
howdy = { path = ".." }
opentelemetry_api = ">= 1.5.0 and < 2.0.0"
gloo = ">= 1.0.2 and < 2.0.0"
pog = ">= 4.1.0 and < 5.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
howdy_telemetry = { path = "../telemetry" }
