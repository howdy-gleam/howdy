name = "howdy_storage"
version = "1.0.0"
gleam = ">= 1.18.0"
description = "File storage for Howdy apps: one API over S3-compatible buckets, a local folder and memory, with signed URLs"
licences = ["Apache-2.0"]
repository = { type = "github", user = "mikeyjones", repo = "howdy", path = "storage", tag-prefix = "howdy_storage-" }
internal_modules = ["howdy/storage/internal/*"]
target = "erlang"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_crypto = ">= 1.5.0 and < 2.0.0"
gleam_time = ">= 1.8.0 and < 2.0.0"
howdy = { path = ".." }
bucket = ">= 1.5.0 and < 2.0.0"
simplifile = ">= 2.3.0 and < 3.0.0"
filepath = ">= 1.1.2 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
