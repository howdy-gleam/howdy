name = "howdy_jobs"
version = "2.0.0"
gleam = ">= 1.18.0"
description = "Background jobs for Howdy apps: queued in your database inside your own transactions, retried with backoff, and run on a schedule"
licences = ["Apache-2.0"]
repository = { type = "github", user = "mikeyjones", repo = "howdy", path = "jobs", tag-prefix = "howdy_jobs-" }
internal_modules = ["howdy/jobs/internal/*"]
target = "erlang"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.8.0 and < 2.0.0"
logging = ">= 1.3.0 and < 2.0.0"
gloo = ">= 1.0.2 and < 2.0.0"
pog = ">= 4.1.0 and < 5.0.0"
howdy = { path = ".." }
howdy_database = { path = "../database" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
howdy_telemetry = { path = "../telemetry" }
