name = "howdy_auth"
version = "1.0.0"
gleam = ">= 1.18.0"
description = "Optional authentication and role-based authorization for Howdy"
licences = ["Apache-2.0"]
repository = { type = "github", user = "howdy-gleam", repo = "howdy", path = "auth", tag-prefix = "howdy_auth-" }
links = [{ title = "Website", href = "https://tryhowdy.dev" }]
internal_modules = ["howdy/auth/internal/*"]
target = "erlang"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.8.0 and < 2.0.0"
gleam_crypto = ">= 1.5.0 and < 2.0.0"
howdy = { path = ".." }
howdy_database = { path = "../database" }
howdy_i18n = { path = "../i18n" }
howdy_mail = { path = "../mail" }
smail = ">= 2.0.1 and < 3.0.0"
logging = ">= 1.3.0 and < 2.0.0"
gloo = ">= 1.0.2 and < 2.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
# Exact: src/howdy/auth/internal/webauthn_adapter.gleam uses glasslock/internal,
# which carries no stability promise. See that module before moving the pin.
glasslock = "== 1.0.0-rc1"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
howdy_telemetry = { path = "../telemetry" }
