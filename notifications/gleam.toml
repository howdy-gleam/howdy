name = "howdy_notifications"
version = "2.0.0"
gleam = ">= 1.18.0"
description = "Notifications for Howdy apps: an inbox kept until read, pushed live to open pages, with email, digests and Web Push"
licences = ["Apache-2.0"]
repository = { type = "github", user = "mikeyjones", repo = "howdy", path = "notifications", tag-prefix = "howdy_notifications-" }
internal_modules = ["howdy/notifications/internal/*"]
target = "erlang"

[erlang]
extra_applications = ["crypto", "public_key"]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
argv = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_crypto = ">= 1.5.0 and < 2.0.0"
logging = ">= 1.3.0 and < 2.0.0"
gloo = ">= 1.0.2 and < 2.0.0"
howdy = { path = ".." }
howdy_database = { path = "../database" }
howdy_mail = { path = "../mail" }
howdy_jobs = { path = "../jobs" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
